<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <canvas id="canvas" style="position: absolute; width: 100%; height: 100%;"></canvas>

    <script>
        const canvas = document.getElementById("canvas")
        const ctx = canvas.getContext("2d")

        let cam_pos = [0, 0, 0]
        let cam_ro = [0, 0, 0]

        var pressedKeys = {};
        window.onkeyup = function (e) { pressedKeys[e.key.toLowerCase()] = false; }
        window.onkeydown = function (e) { pressedKeys[e.key.toLowerCase()] = true; }

        function cast(origin, rotation, sliceLength, slices) {
            function vectorize(ro) {
                let yaw = ro[1];
                let pitch = ro[0];

                x = Math.cos(yaw)*Math.cos(pitch);
                y = Math.sin(yaw)*Math.cos(pitch);
                z = Math.sin(pitch);
                return [x, y, z]
            }

            let vector = vectorize(rotation)
            let point = origin
            for (let s = 0; s < slices; s++) {
                let voxPos = [
                    Math.round(point[0]),
                    Math.round(point[1]),
                    Math.round(point[2]),
                ]
                
                ctx.fillRect(voxPos[0], voxPos[1], 1, 1)

                point[0] += vector[0]*sliceLength
                point[1] += vector[1]*sliceLength
                point[2] += vector[2]*sliceLength
            }
        }

        let fov = 1.2

        setInterval(() => {
            ctx.fillStyle = "white"
            ctx.fillRect(0, 0, 500, 500)

            if (pressedKeys["w"]) {
                cam_pos[0] += .1
            }
            if (pressedKeys["s"]) {
                cam_pos[0] -= .1
            }
            if (pressedKeys["a"]) {
                cam_pos[1] += .1
            }
            if (pressedKeys["d"]) {
                cam_pos[1] -= .1
            }

            if (pressedKeys["arrowleft"]) {
                cam_ro[0] += .01
            }
            if (pressedKeys["arrowright"]) {
                cam_ro[0] -= .01
            }

            if (pressedKeys["arrowup"]) {
                cam_ro[1] += .01
            }
            if (pressedKeys["arrowdown"]) {
                cam_ro[1] -= .01
            }

            if (pressedKeys["r"]) {
                fov += .01
            }
            if (pressedKeys["t"]) {
                fov -= .01
            }

            ctx.fillStyle = "black"
            ctx.fillRect(cam_pos[0], cam_pos[1], 4, 4)



            for (let x = 0; x < 10; x++) {
                for (let y = 0; y < 10; y++) {
                    let xrOffset = (x/10)-.5
                    let yrOffset = (y/10)-.5

                    let c = cast(
                        [cam_pos[0], cam_pos[1], cam_pos[2]], 
                        [
                            cam_ro[0]+(xrOffset*fov),
                            cam_ro[1]+(yrOffset*fov),
                            cam_ro[2]
                        ], 
                        1, 40)
                }
            }
        }, 4);
    </script>
</body>
</html>
